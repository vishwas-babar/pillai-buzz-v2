name: cd

on:
   push:
      branches:
         - main

jobs:
   docker:
      runs-on: ubuntu-latest
      name: "Build and Push Docker Image"

      steps:
         - uses: actions/checkout@v4

         - name: Setup Environment
           run: |
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> apps/api/.env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> apps/api/.env
              echo "PORT=${{ vars.PORT }}" >> apps/api/.env
              echo "JWT_ACCESS_EXPIRY=${{ vars.JWT_ACCESS_EXPIRY }}" >> apps/api/.env
              echo "JWT_REFRESH_EXPIRY=${{ vars.JWT_REFRESH_EXPIRY }}" >> apps/api/.env

         - name: Login to Docker Hub
           uses: docker/login-action@v3
           with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

         - name: Build and Push
           uses: docker/build-push-action@v5
           with:
              context: .
              push: true
              tags: |
                 ${{ secrets.DOCKER_USERNAME }}/pillaibuzz-api:latest
                 ${{ secrets.DOCKER_USERNAME }}/pillaibuzz-api:${{ github.sha }}
