name: Docker ci

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

jobs:
   lint-and-typecheck:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout
           uses: actions/checkout@v4
         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
         - name: Setup pnpm
           uses: pnpm/action-setup@v4
         - name: Install dependencies
           run: pnpm install --frozen-lockfile
         - name: Build workspace
           run: pnpm build
         - name: Linting check
           run: pnpm lint
         - name: Type check
           run: pnpm typecheck

   docker-build-and-push:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - name: Setup Environment
           run: |
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> apps/api/.env
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> apps/api/.env
              echo "PORT=${{ vars.PORT }}" >> apps/api/.env
              echo "JWT_ACCESS_EXPIRY=${{ vars.JWT_ACCESS_EXPIRY }}" >> apps/api/.env
              echo "JWT_REFRESH_EXPIRY=${{ vars.JWT_REFRESH_EXPIRY }}" >> apps/api/.env

         - name: Login to Docker Hub
           uses: docker/login-action@v3
           with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}

         - name: Build and Push
           uses: docker/build-push-action@v5
           with:
              context: .
              push: true
              tags: |
                 ${{ secrets.DOCKERHUB_USERNAME }}/pillaibuzz:latest
                 ${{ secrets.DOCKERHUB_USERNAME }}/pillaibuzz:${{ github.sha }}
